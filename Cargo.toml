[package]
name = "hotkv-client"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["HotKV Ltd"]
description = "A high-performance Rust client for HotKV, a RESP2/RESP3-compatible in-memory data store with built-in AI and LLM-serving features."
homepage = "https://hotkv.com"
repository = "https://github.com/hotkv-ltd/hotkv-rust-client"
readme = "README.md"
license = "Apache-2.0"
keywords = ["hotkv", "database", "cache", "async", "llm"]
categories = ["database", "asynchronous", "caching"]
exclude = [".github/", ".gitignore"]

[lib]
name = "hotkv"

[features]
default = []
tls = ["dep:tokio-rustls", "dep:rustls-pemfile", "dep:webpki-roots"]

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
futures-core = "0.3"
sha2 = "0.11"
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[package.metadata.docs.rs]
all-features = true
